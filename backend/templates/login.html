<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Social Assistant Login</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* BODY */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
    color:white;
    background:
        linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.8)),
        url("https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=1974&auto=format&fit=crop")
        center/cover no-repeat;
    position:relative;
}

/* ANIMATED PARTICLES */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, #7f5af0 2px, transparent 2px),
        radial-gradient(circle at 80% 60%, #2cb67d 2px, transparent 2px),
        radial-gradient(circle at 50% 80%, white 1px, transparent 1px);
    background-size:120px 120px;
    animation:moveBg 20s linear infinite;
    opacity:.3;
}

@keyframes moveBg{
    from{
        background-position:0 0;
    }
    to{
        background-position:500px 800px;
    }
}

/* TITLE */
.hero-title{
    font-size:48px;
    font-weight:900;
    margin-bottom:10px;
    z-index:1;

    background:linear-gradient(45deg,#ffffff,#7f5af0,#2cb67d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:floatText 3s ease-in-out infinite;
}

@keyframes floatText{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
    100%{
        transform:translateY(0px);
    }
}

/* TAGLINE */
.tagline{
    color:#ccc;
    margin-bottom:30px;
    z-index:1;
}

/* LOGIN BOX */
.box{
    width:350px;
    padding:30px;

    border-radius:18px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
        0 0 25px rgba(127,90,240,.4),
        inset 0 0 10px rgba(255,255,255,.05);

    z-index:1;

    animation:glow 3s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 20px rgba(127,90,240,.4);
    }
    to{
        box-shadow:0 0 40px rgba(127,90,240,.8);
    }
}

.box h2{
    text-align:center;
    margin-bottom:20px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin-top:14px;

    border:none;
    border-radius:10px;

    background:rgba(255,255,255,.12);

    color:white;
    font-size:14px;
}

input::placeholder{
    color:#ccc;
}

input:focus{
    outline:none;
    border:1px solid #7f5af0;
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:20px;

    border:none;
    border-radius:10px;

    background:linear-gradient(135deg,#7f5af0,#2cb67d);

    color:white;
    font-weight:bold;
    cursor:pointer;

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(127,90,240,.6);
}

/* ERROR */
.error{
    margin-top:15px;
    padding:10px;

    border-radius:8px;

    background:rgba(255,0,0,.15);
    border:1px solid rgba(255,0,0,.3);

    color:#ffb3b3;

    text-align:center;
    font-size:14px;
}

/* LINK */
a{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#ccc;
    text-decoration:none;
}

a:hover{
    color:white;
}

</style>
</head>

<body>

<h1 class="hero-title">
AI Social Assistant
</h1>

<p class="tagline">
One AI. Multiple Platforms. Unlimited Possibilities.
</p>

<div class="box">

<h2>🔐 Secure Login</h2>

<form method="POST" action="/login">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<a href="/register">
    New user? Register
</a>

</div>

</body>
</html>
