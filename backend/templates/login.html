<!DOCTYPE html>
<html>
<head>
<title>Admin Login | AI Social Chatbot</title>

<style>

/* ===== RESET ===== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

/* ===== BODY ===== */
body{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
  color:white;

  background:
    linear-gradient(120deg, rgba(20,20,30,.6), rgba(0,0,0,.9)),
    url("https://images.unsplash.com/photo-1677442136019-21780ecad995")
    center/cover no-repeat;
}

/* ===== FLOATING PARTICLES ===== */
body::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(circle at 20% 30%, #7f5af0 2px, transparent 2px),
    radial-gradient(circle at 80% 60%, #2cb67d 2px, transparent 2px),
    radial-gradient(circle at 50% 80%, white 1px, transparent 1px);

  background-size:120px 120px;

  animation:floatParticles 18s linear infinite;

  opacity:.35;
}

@keyframes floatParticles{
  from{
    background-position:0 0;
  }
  to{
    background-position:400px 700px;
  }
}

/* ===== HERO TITLE ===== */
.hero-title{
  font-size:46px;
  font-weight:900;
  margin-bottom:10px;
  z-index:1;

  background:linear-gradient(45deg,#ffffff,#8b5cf6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  animation:titleFloat 3s ease-in-out infinite;
}

@keyframes titleFloat{
  0%{
    transform:translateY(0px);
  }
  50%{
    transform:translateY(-8px);
  }
  100%{
    transform:translateY(0px);
  }
}

/* ===== TAGLINE ===== */
.tagline{
  color:#cccccc;
  margin-bottom:30px;
  z-index:1;
  font-size:15px;
}

/* ===== LOGIN BOX ===== */
.box{
  width:350px;
  padding:30px;
  border-radius:18px;

  background:rgba(255,255,255,.08);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,.1);

  box-shadow:
    0 0 25px rgba(127,90,240,.35),
    inset 0 0 15px rgba(255,255,255,.05);

  z-index:1;

  animation:glow 3s infinite alternate;
}

@keyframes glow{
  from{
    box-shadow:
      0 0 20px rgba(127,90,240,.35),
      inset 0 0 10px rgba(255,255,255,.04);
  }

  to{
    box-shadow:
      0 0 35px rgba(127,90,240,.75),
      inset 0 0 15px rgba(255,255,255,.08);
  }
}

.box h2{
  text-align:center;
  margin-bottom:20px;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:13px;
  margin-top:14px;

  border:none;
  outline:none;

  border-radius:10px;

  background:rgba(255,255,255,.12);

  color:white;

  font-size:14px;
}

input::placeholder{
  color:#d1d5db;
}

/* ===== BUTTON ===== */
button{
  width:100%;
  padding:13px;
  margin-top:18px;

  border:none;
  border-radius:10px;

  background:linear-gradient(135deg,#7f5af0,#2cb67d);

  color:white;
  font-weight:bold;
  font-size:15px;

  cursor:pointer;

  transition:.3s;
}

button:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 25px rgba(127,90,240,.6);
}

/* ===== ERROR ===== */
.error{
  background:rgba(255,77,77,.12);

  border:1px solid rgba(255,77,77,.3);

  color:#ff7b7b;

  padding:10px;

  border-radius:8px;

  margin-bottom:15px;

  text-align:center;

  font-size:14px;
}

/* ===== LINK ===== */
a{
  display:block;
  text-align:center;
  margin-top:16px;

  color:#cccccc;

  text-decoration:none;

  transition:.3s;
}

a:hover{
  color:white;
}

</style>
</head>

<body>

<h1 class="hero-title">
AI Social Assistant
</h1>

<p class="tagline">
One AI. Multiple Platforms. Unlimited Possibilities.
</p>

<div class="box">

<h2>🔐 Secure Login</h2>

{% if error %}
<div class="error">
  {{ error }}
</div>
{% endif %}

<form method="post" action="/login">

  <input
    type="text"
    name="username"
    placeholder="Username"
    required
  >

  <input
    type="password"
    name="password"
    placeholder="Password"
    required
  >

  <button type="submit">
    Login
  </button>

</form>

<a href="/register">
New user? Register
</a>

</div>

</body>
</html>
